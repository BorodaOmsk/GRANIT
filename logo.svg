    <path d="M30 96 C55 72 100 120 126 92" fill="none" stroke="url(#steel2)" stroke-width="8" stroke-linecap="round"/>
    <path d="M30 120 C55 98 100 144 126 116" fill="none" stroke="#6b7684" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
